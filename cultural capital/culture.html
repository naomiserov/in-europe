<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cultural Capital Assessment</title>

<link rel="stylesheet" href="culture.css">

</head>

<body>

<h1>CULTURAL CAPITAL ASSESSMENT</h1>

<p>
Please complete the following assessment.
All answers are automatically converted into numerical values.
</p>


<form id="capitalForm">


<h2>1. Embodied Capital</h2>


<label>Accent</label>
<select id="accent">
<option value="0">Western Europe</option>
<option value="-1">Central & Eastern Europe</option>
<option value="-2">Eastern Europe & Western Russia</option>
<option value="-3">Caucasus & Turkey</option>
<option value="-4">Central Asia & Middle East</option>
<option value="-5">South Asia</option>
<option value="-6">East & Southeast Asia</option>
</select>


<label>Number of native languages</label>
<input type="number" id="languages">


<label>Country GDP / 10 billion (rounded)</label>
<input type="number" id="gdp">


<label>Do you have parents?</label>
<select id="parents">
<option value="1">Yes</option>
<option value="0">No</option>
</select>


<label>Both parents?</label>
<select id="bothParents">
<option value="1">Yes</option>
<option value="0">No</option>
</select>


<label>Paternal home country GDP / 10 billion</label>
<input type="number" id="fatherGDP">


<label>Maternal home country GDP / 10 billion</label>
<input type="number" id="motherGDP">


<label>Father's highest degree</label>
<select id="fatherDegree">
<option value="0">None</option>
<option value="1">Primary</option>
<option value="2">Secondary</option>
<option value="3">Vocational</option>
<option value="4">Bachelor</option>
<option value="5">Master</option>
<option value="6">PhD</option>
</select>


<label>Mother's highest degree</label>
<select id="motherDegree">
<option value="0">None</option>
<option value="1">Primary</option>
<option value="2">Secondary</option>
<option value="3">Vocational</option>
<option value="4">Bachelor</option>
<option value="5">Master</option>
<option value="6">PhD</option>
</select>


<label>Driving licence</label>
<select id="license">
<option value="1">Yes</option>
<option value="0">No</option>
</select>


<label>If you tell a joke, do people laugh?</label>
<select id="joke">
<option value="1">Yes</option>
<option value="0">No</option>
</select>

<h2>2. Objectified Capital</h2>

<label>How many books have you read and remember reading?</label>
<input type="number" id="books" min="0">

<label>How many works do you possess (excluding your own)?</label>
<input type="number" id="works" min="0">

<label>Do you have an atelier?</label>
<select id="atelier">
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>How many Apple devices do you own?</label>
<input type="number" id="apple" min="0">

<label>How many important art institutions have you visited?</label>
<input type="number" id="institutions" min="0">

<label>How many important churches have you visited while functioning as churches?</label>
<input type="number" id="churches" min="0">

<label>How many important mosques have you visited while functioning as mosques?</label>
<input type="number" id="mosques" min="0">

<label>How many important Buddhist temples have you visited while functioning as Buddhist temples?</label>
<input type="number" id="temples" min="0">

<label>How many other sacral spaces have you visited?</label>
<input type="number" id="sacral" min="0">

<label>Have you visited the Venice Biennale?</label>
<select id="biennale">
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>How many concerts have you attended?</label>
<input type="number" id="concerts" min="0">

<label>How many theatre performances have you attended?</label>
<input type="number" id="theatre" min="0">

<label>How many solo exhibitions have you had?</label>
<input type="number" id="solo" min="0">

<label>How many duo exhibitions have you had?</label>
<input type="number" id="duo" min="0">

<label>How many group exhibitions have you had?</label>
<input type="number" id="group" min="0">

<label>How many publications have you authored?</label>
<input type="number" id="publications" min="0">

<label>How many times have you been mentioned by other publishers?</label>
<input type="number" id="mentions" min="0">

<h2>3. Institutionalized Capital</h2>

<label>How many Bachelor's degrees do you have?</label>
<input type="number" id="bachelor" min="0">

<label>How many Master's degrees do you have?</label>
<input type="number" id="master" min="0">

<label>How many funded research projects have you started?</label>
<input type="number" id="research" min="0">

<label>How many PhDs do you have?</label>
<input type="number" id="phd" min="0">

<label>How many grants or prizes have you received?</label>
<input type="number" id="grants" min="0">

<label>How many residencies have you completed?</label>
<input type="number" id="residencies" min="0">

<label>Did you manage to have a job in your field?</label>
<select id="job">
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>Highest certified level of a current lingua franca</label>
<select id="languageLevel">
    <option value="1">A1</option>
    <option value="2">A2</option>
    <option value="3">B1</option>
    <option value="4">B2</option>
    <option value="5">C1</option>
    <option value="6">C2</option>
</select>

<h2>Portrait Archive</h2>

<label>Upload portrait</label>
<input type="file" id="portrait" accept="image/*">


<label>Choose archive colour</label>
<input type="color" id="colour" value="#000000">



<button type="submit">
Submit Assessment
</button>


</form>


<div id="result"></div>


<script type="module" src="script.js"></script>

</body>
</html>
