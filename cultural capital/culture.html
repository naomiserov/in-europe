```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cultural Capital Assessment</title>

    <link rel="stylesheet" href="culture.css">
</head>

<body>

<h1>YOUR STATS</h1>

<p>
    Please complete the following assessment to see where you stand culturally.
</p>

<form id="capitalForm">

    <!-- ==================================================
         1. EMBODIED CAPITAL
         ================================================== -->

    <h2>1. Embodied Capital</h2>

    <label for="accent">Accent</label>
    <select id="accent">
        <option value="0">Western Europe (+0)</option>
        <option value="-1">Central Europe (-1)</option>
        <option value="-2">Eastern Europe & Western Russia (-2)</option>
        <option value="-3">Caucasus & Turkey (-3)</option>
        <option value="-4">Central Asia & Middle East (-4)</option>
        <option value="-5">East & Southeast Asia (-5)</option>
        <option value="-6">South Asia (-6)</option>
    </select>


    <label for="gdp">
        Home country GDP / 10 billion (rounded)
    </label>
    <input
        type="number"
        id="gdp"
        min="0"
    >


    <label for="fatherGDP">
        Paternal home country GDP / 10 billion (rounded)
    </label>
    <input
        type="number"
        id="fatherGDP"
        min="0"
    >


    <label for="motherGDP">
        Maternal home country GDP / 10 billion (rounded)
    </label>
    <input
        type="number"
        id="motherGDP"
        min="0"
    >


    <label for="fatherDegree">
        Father's highest degree
    </label>
    <select id="fatherDegree">
        <option value="0">None (+0)</option>
        <option value="1">Primary school (+1)</option>
        <option value="2">Secondary school (+2)</option>
        <option value="3">Vocational school (+3)</option>
        <option value="4">Bachelor (+4)</option>
        <option value="5">Master (+5)</option>
        <option value="6">PhD (+6)</option>
        <option value="7">Postdoc (+7)</option>
    </select>


    <label for="motherDegree">
        Mother's highest degree
    </label>
    <select id="motherDegree">
        <option value="0">None (+0)</option>
        <option value="1">Primary school (+1)</option>
        <option value="2">Secondary school (+2)</option>
        <option value="3">Vocational school (+3)</option>
        <option value="4">Bachelor (+4)</option>
        <option value="5">Master (+5)</option>
        <option value="6">PhD (+6)</option>
        <option value="7">Postdoc (+7)</option>
    </select>


    <label for="license">
        Driving licence
    </label>
    <select id="license">
        <option value="1">Yes (+1)</option>
        <option value="0">No (+0)</option>
    </select>


    <!-- ==================================================
         2. OBJECTIFIED CAPITAL
         ================================================== -->

    <h2>2. Objectified Capital</h2>


    <label for="books">
        How many books did you read?
    </label>
    <input
        type="number"
        id="books"
        min="0"
    >


    <label for="works">
        How many works do you possess (not your own)?
    </label>
    <input
        type="number"
        id="works"
        min="0"
    >


    <label for="atelier">
        Do you have an atelier?
    </label>
    <select id="atelier">
        <option value="1">Yes (+1)</option>
        <option value="0">No (+0)</option>
    </select>


    <label for="institutions">
        How many important art institutions did you visit?
    </label>
    <input
        type="number"
        id="institutions"
        min="0"
    >


    <label for="churches">
        How many important churches did you visit
        (functional as churches at the moment of the visit)?
    </label>
    <input
        type="number"
        id="churches"
        min="0"
    >


    <label for="mosques">
        How many important mosques did you visit
        (functional as mosques at the moment of your visit)?
    </label>
    <input
        type="number"
        id="mosques"
        min="0"
    >


    <label for="temples">
        How many important Buddhist temples did you visit
        (functional as Buddhist temples at the moment of your visit)?
    </label>
    <input
        type="number"
        id="temples"
        min="0"
    >


    <label for="sacral">
        How many other sacral spaces?
    </label>
    <input
        type="number"
        id="sacral"
        min="0"
    >


    <label for="biennale">
        Did you see any Venice Biennale yet?
    </label>
    <select id="biennale">
        <option value="1">Yes (+1)</option>
        <option value="0">No (+0)</option>
    </select>


    <label for="concerts">
        How many concerts did you see?
    </label>
    <input
        type="number"
        id="concerts"
        min="0"
    >


    <label for="theatre">
        How many theater plays did you see?
    </label>
    <input
        type="number"
        id="theatre"
        min="0"
    >


    <label for="solo">
        How many solo shows did you have?
    </label>
    <input
        type="number"
        id="solo"
        min="0"
    >


    <label for="duo">
        How many duo shows did you have?
    </label>
    <input
        type="number"
        id="duo"
        min="0"
    >


    <label for="group">
        How many group shows did you have?
    </label>
    <input
        type="number"
        id="group"
        min="0"
    >


    <label for="publications">
        How much did you publish?
    </label>
    <input
        type="number"
        id="publications"
        min="0"
    >


    <label for="mentions">
        How often are you mentioned by other publishers?
    </label>
    <input
        type="number"
        id="mentions"
        min="0"
    >


    <!-- ==================================================
         3. INSTITUTIONALIZED CAPITAL
         ================================================== -->

    <h2>3. Institutionalized Capital</h2>


    <label for="master">
        How many Master degrees do you have?
    </label>
    <input
        type="number"
        id="master"
        min="0"
    >


    <label for="bachelor">
        How many Bachelor degrees do you have?
    </label>
    <input
        type="number"
        id="bachelor"
        min="0"
    >


    <label for="research">
        How many funded research projects did you start?
    </label>
    <input
        type="number"
        id="research"
        min="0"
    >


    <label for="phd">
        How many PhDs do you have?
    </label>
    <input
        type="number"
        id="phd"
        min="0"
    >


    <label for="grants">
        How many grants or prizes were you awarded?
    </label>
    <input
        type="number"
        id="grants"
        min="0"
    >


    <label for="residencies">
        How many residencies did you take part in?
    </label>
    <input
        type="number"
        id="residencies"
        min="0"
    >


    <label for="job">
        Did you manage to have a job in your field?
    </label>
    <select id="job">
        <option value="20">Yes (+20)</option>
        <option value="-5">No (-5)</option>
    </select>


    <label for="languageLevel">
        Highest level of a current lingua franca
    </label>
    <select id="languageLevel">
        <option value="1">A1 (+1)</option>
        <option value="2">A2 (+2)</option>
        <option value="3">B1 (+3)</option>
        <option value="4">B2 (+4)</option>
        <option value="5">C1 (+5)</option>
        <option value="6">C2 (+6)</option>
    </select>


    <!-- ==================================================
         PORTRAIT ARCHIVE
         ================================================== -->

    <h2>Portrait Archive</h2>


    <label for="portrait">
        Upload portrait
    </label>
    <input
        type="file"
        id="portrait"
        accept="image/*"
    >


    <label for="colour">
        Choose archive colour
    </label>
    <input
        type="color"
        id="colour"
        value="#000000"
    >


    <button type="submit">
        Submit Assessment
    </button>

</form>


<div id="result"></div>


<script type="module" src="script.js"></script>

</body>
</html>
```
