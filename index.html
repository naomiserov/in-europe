<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisi and commodification of nothingness</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="map-wrapper">
  <img src="website map.jpeg" alt="intro-page">
  <a href="stok/stok.html" class="hotspot" style="top: 378px; left:137px; width:10%; height:1.5%;"></a>
  <a href="mu/mu.html" class="hotspot" style="top: 393px; left: 95px; width: 3%; height: 3%;"></a>
  <a href="cheburashka/cheb.html" class="hotspot" style="top: 406px; left: 131px; width: 10%; height: 2%;"></a>
  <a href="horse/horse.html" class="hotspot" style="top: 421px; left: 131px; width: 10%; height: 3%;"></a>
  <a href="wandering.html" class="hotspot" style="top: 95%; left: 30%; width: 50%; height: 6%;"></a>
  <a href="sisi/sisi.html" class="hotspot" style="top: 90%; left: 28%; width: 35%; height: 3%; "></a>
</div>

<script src="https://unpkg.com/image-map-resizer/js/imageMapResizer.min.js"></script>
<script>
  imageMapResize();
</script>
<script>
const hotspots = document.querySelectorAll('.hotspot');

hotspots.forEach(hotspot => {
  let isDragging = false;
  let offsetX, offsetY;

  hotspot.addEventListener('mousedown', e => {
    isDragging = true;
    offsetX = e.offsetX;
    offsetY = e.offsetY;
  });

  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const wrapper = hotspot.parentElement.getBoundingClientRect();
    let left = e.clientX - wrapper.left - offsetX;
    let top = e.clientY - wrapper.top - offsetY;

    // Keep hotspot inside image
    left = Math.max(0, Math.min(left, wrapper.width - hotspot.offsetWidth));
    top = Math.max(0, Math.min(top, wrapper.height - hotspot.offsetHeight));

    hotspot.style.left = left + 'px';
    hotspot.style.top = top + 'px';
  });

  document.addEventListener('mouseup', e => {
    if (isDragging) isDragging = false;
  });
});
</script>
</body>
</html>
